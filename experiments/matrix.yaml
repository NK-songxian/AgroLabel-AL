# AgroLabel-AL 模型实验矩阵
# 依据：docs/模型实验作战手册.html（B0–B3 / Z1–Z3 / F1–F4 / I-01–I-04）
# 执行：python experiments/run_matrix.py --list / --dry-run B0 / --run B0 / --phase baseline
# 说明：本文件只定义；运行状态写到 experiments/matrix_state.json，不改本文件。
#       占位符 {repo} {data_root} {data_yaml} {weights} {out} 由执行器解析。

meta:
  name: AgroLabel-AL 模型实验矩阵
  protocol: docs/模型实验作战手册.html
  data_root_cloud: "{repo}/data/plantseg34"
  data_root_local: F:/_plantseg/dataset_plantseg_34
  weights: weights/baseline_yolov8nseg_plantseg34_best.pt
  sam3_weights: "{repo}/weights/sam3.pt"
  splits: { train: 5367, val: 846, test: 1560 }
  metrics: [mask_mAP50, mask_mAP50_95, mask_mAP75, instance_recall, boundary_f1, matched_dice]
  eval_note: 验证集选模型/阈值，测试集锁定后只评一次；AP 与 YOLO 框 AP 不混比。

experiments:
  # ---------------- 基线 B ----------------
  - id: B0
    name: YOLOv8n-seg 复评 640
    phase: baseline
    priority: must
    status: todo
    command: "{py} src/m6_editcost.py --data {data_yaml} --split val --weights {weights} --imgsz 640 --device 0 --out-dir {out}"
    note: 统一权重/配置/分割口径，解释历史 0.0568 / 0.2492 / 0.287 的差异来源。

  - id: B1
    name: YOLOv8n-seg 960
    phase: baseline
    priority: must
    status: todo
    needs: [train]
    command: "{py} training/train_seg_baseline.py --data {data_yaml} --model {repo}/weights/yolov8n-seg.pt --imgsz 960 --epochs 150 --name b1_v8n_960 --project {out}/runs"
    note: 与 B0 比分辨率收益；batch 变化需记录。

  - id: B2
    name: YOLOv8x-seg 640
    phase: baseline
    priority: must
    status: todo
    needs: [train, yolov8x-seg.pt]
    command: "{py} training/train_seg_baseline.py --data {data_yaml} --model {repo}/weights/yolov8x-seg.pt --imgsz 640 --epochs 150 --batch 32 --name b2_v8x_640 --project {out}/runs"
    note: 原设计为 v8s，官方 v8s-seg 权重在内网拿不到，改用 v8x（规模档位由 s 提到 x）；与 B0 比模型规模收益。batch 32（96G 卡，batch 16 时 GPU 空转）。

  - id: B3
    name: YOLOv8x-seg 960
    phase: baseline
    priority: must
    status: todo
    needs: [train, yolov8x-seg.pt]
    command: "{py} training/train_seg_baseline.py --data {data_yaml} --model {repo}/weights/yolov8x-seg.pt --imgsz 960 --epochs 150 --name b3_v8x_960 --project {out}/runs"
    note: 规模×分辨率交互（v8x @960）。

  - id: B4
    name: YOLO26x-seg 640
    phase: baseline
    priority: extended
    status: todo
    needs: [train, yolo26x-seg.pt]
    command: "{py} training/train_seg_baseline.py --data {data_yaml} --model {repo}/weights/yolo26x-seg.pt --imgsz 640 --epochs 150 --batch 32 --name b4_y26x_640 --project {out}/runs"
    note: 换代对照（26x vs 8x，同为 x 规模、640）。与 B2 配对比较。batch 32。

  - id: B5
    name: YOLO26x-seg 960
    phase: baseline
    priority: extended
    status: todo
    needs: [train, yolo26x-seg.pt]
    command: "{py} training/train_seg_baseline.py --data {data_yaml} --model {repo}/weights/yolo26x-seg.pt --imgsz 960 --epochs 150 --name b5_y26x_960 --project {out}/runs"
    note: 换代 × 分辨率（26x @960）。与 B3 配对比较。

  # ---------------- 零样本 Z ----------------
  - id: Z1
    name: SAM3 零样本·病斑提示（host_0）
    phase: zeroshot
    priority: must
    status: done
    command: "{py} -m sam3_baseline.prompt_sweep --split val --data-root {data_root} --ckpt {sam3_weights} --out {out} --variants host_0 --imgsz 1008"
    note: 已完成 S0/S1；全 846 张 mAP50=0.1709，200 子集=0.2146（见 experiments/sam3_s1/sweep.json）。

  - id: Z2
    name: YOLO-World 零样本检测
    phase: zeroshot
    priority: recommended
    status: todo
    needs: [yolov8x-worldv2.pt, clip ViT-B-32]
    command: "{py} src/m12_openvocab_eval.py --kind world --weights {repo}/weights/yolov8x-worldv2.pt --data {data_yaml} --split val --device 0 --out {out}/Z2.json"
    note: 只出框 AP，不与掩码 AP 混比；高阈值不得提前截断。权重+CLIP 已由本地下载经 scp 上传(weights/、weights/clip/)。

  - id: Z3
    name: YOLOE-Seg 零样本
    phase: zeroshot
    priority: recommended
    status: todo
    needs: [yoloe-11l-seg.pt, mobileclip_blt.ts]
    command: "{py} src/m12_openvocab_eval.py --kind yoloe --weights {repo}/weights/yoloe-11l-seg.pt --data {data_yaml} --split val --device 0 --out {out}/Z3.json"
    note: 评估单类病斑掩码及提示敏感性。YOLOE 文本编码器 mobileclip_blt.ts 已上传(仓库根/weights)。

  - id: Z2b
    name: YOLO-World 零样本·病征短语提示（Z2 的提示对照）
    phase: zeroshot
    priority: recommended
    status: todo
    command: "{py} src/m12_openvocab_eval.py --kind world --prompt-source phrases --weights {repo}/weights/yolov8x-worldv2.pt --data {data_yaml} --split val --device 0 --out {out}/Z2b.json"
    note: 与 Z2 唯一差异是提示词（host_prompt_bank 的 host_level_phrases vs 裸宿主名），其余完全相同，构成单变量对照。用于把 Z2 的 0.00378 归因到提示语义错配（物种名 vs 病斑），而非模型能力。

  - id: Z3b
    name: YOLOE-Seg 零样本·病征短语提示（Z3 的提示对照）
    phase: zeroshot
    priority: recommended
    status: todo
    command: "{py} src/m12_openvocab_eval.py --kind yoloe --prompt-source phrases --weights {repo}/weights/yoloe-11l-seg.pt --data {data_yaml} --split val --device 0 --out {out}/Z3b.json"
    note: 同 Z2b，对应 Z3 的 0.00637 seg mAP50。

  # ---------------- 提示词工程扫描 ----------------
  - id: Z2s
    name: YOLO-World 提示词扫描（7 模板族）
    phase: zeroshot
    priority: recommended
    status: todo
    command: "{py} src/m14_prompt_sweep.py --kind world --weights {repo}/weights/yolov8x-worldv2.pt --data {data_yaml} --split val --device 0 --out {out}"
    note: 7 族单变量消融（病征词族/句法/粒度），含 species_only 基线锚点。判读要点：量级由"有无病征词"决定；病害级提示 dice↑但召回↓、AP 可能↓，需同时看 mAP50 与 dice。

  - id: Z3s
    name: YOLOE-Seg 提示词扫描（7 模板族）
    phase: zeroshot
    priority: recommended
    status: todo
    command: "{py} src/m14_prompt_sweep.py --kind yoloe --weights {repo}/weights/yoloe-11l-seg.pt --data {data_yaml} --split val --device 0 --out {out}"
    note: 同 Z2s，额外有 seg 指标。与 SAM3 侧的 host_0/disease_0/species_tuned 扫描（experiments/sam3_s1/sweep.json）交叉验证提示工程结论是否跨模型成立。

  - id: Z1s
    name: SAM3 提示词扫描（7 族，对称对照）
    phase: zeroshot
    priority: recommended
    status: running
    command: "{py} src/m15_sam3_prompt_sweep.py --data-root {data_root} --ckpt {sam3_weights} --host-bank configs/sam3/host_prompt_bank.json --split val --out {out}"
    note: 与 Z2s/Z3s（YOLO 系列，提示免疫）对称对照，验证"提示工程只对语义分割有效"。
      复用 m14 的 7 族模板，改用 SAM3 推理（text=[34短语] 一次出 34 类，按 boxes.cls 分桶，
      category_id=cls+1 与 GT 对齐；类别对齐已比对 classes.json 与 bank 顺序一致，无误）。
      实测（诚实零样本·34类同时查询，与 Z2s/Z3s 同协议）：species_only mask_mAP50=0.0007，
      病征短语族 0.0072–0.0102（disease_level 最高 0.0102），提示改写使 SAM3 提升 ~14×；
      而 YOLO 7 族全恒等（0.00377）→ 提示工程只影响 SAM3、不影响 YOLO，假设成立。
      重要修正：此前 sam3_s1 的 0.17 是"GT 宿主条件化"协议（推理泄露 GT 类别来选/标提示）的上界，
      不可与诚实零样本 0.01 混比；SAM3 真实零样本多类 mAP 约 0.01 量级（见本文件顶部 metrics 说明）。

  # ---------------- 微调 F ----------------
  - id: F1
    name: SAM3 全参数微调（S2）
    phase: finetune
    priority: resource
    status: abandoned
    command: "{py} training/run_sam3_ft.py --exp-name f1_s2_full_ft_host --max-epochs 10 --val-freq 5 --lr-scale 0.1"
    note: 2026-11-03 用户决定放弃全参微调（1008+34类下太慢），改用 LoRA（I-01 r16 / I-02 提示鲁棒）作为主线，本项不再执行。原用途：与 I-01 同配置、仅"改哪些参数"不同，构成 LoRA 消融的对照（34 类内置口径 AP50=0.084，oracle-host 口径 0.325，不可混比）。

  - id: F2
    name: YOLOE-Seg 微调
    phase: finetune
    priority: recommended
    status: todo
    needs: [ultralytics_yoloe]
    command: "{py} training/train_yoloe_seg.py --data {data_yaml} --model {repo}/weights/yoloe-11l-seg.pt --imgsz 640 --batch 16 --epochs 150 --name f2_yoloe_l_seg_640 --project {out}/runs"
    note: 官方固定类别微调会融合类别头，训练后不可随意换提示，需记录。权重已下载上传。

  - id: F3
    name: YOLO-World 微调 + SAM3 框提示
    phase: finetune
    priority: recommended
    status: todo
    needs: [ultralytics_yoloworld]
    command: "{py} training/train_yoloworld.py --data {data_yaml} --model {repo}/weights/yolov8x-worldv2.pt --imgsz 640 --batch 16 --epochs 150 --name f3_yoloworld_x_640 --project {out}/runs"
    note: 用预测框而非真值框，同时记录检测与分割收益、总时延（框提示链路见 src/m13_box_prompt_eval.py）。

  - id: F4
    name: YOLO 框 + SAM3 / GT 框 + SAM3
    phase: finetune
    priority: conditional
    status: todo
    command: "{py} src/m13_box_prompt_eval.py --ckpt {sam3_weights} --data-root {data_root} --split val --box-src gt --imgsz 1008 --out {out}/gt_box"
    note: 区分检测器作用；GT 框仅作上限对照。另一种框源：--box-src yolo --yolo-weights {weights}（队列里作为 F4-yolo 单独跑）。

  # ---------------- 创新 I ----------------
  - id: I-01
    name: SAM3-LoRA + 全局—局部病斑感知
    phase: innovation
    priority: main
    status: todo
    needs: [lora_inject, run_sam3_ft]
    command: "{py} training/run_sam3_ft.py --exp-name i01_lora_r16 --max-epochs 10 --val-freq 5 --lr-scale 1.0 --lora-rank 16 --lora-alpha 32 --lora-targets transformer,decoder --lora-extra-trainable mask_decoder"
    note: 主线。注入器 src/lora_inject.py（自带 CPU 自检：注入不改输出、公式一致、只训 lora），Hydra 入口 src/lora_builder.py。先跑 rank16 确认可训练参数与梯度，再做 rank/目标层消融；局部裁剪训练作为第二步（先在整图口径上拿到 LoRA vs 全参的差值）。

  - id: I-02
    name: 提示鲁棒 LoRA（等价表达 + 负提示）
    phase: innovation
    priority: extended
    status: todo
    needs: [I-01 脚本]
    command: "{py} training/run_sam3_ft.py --exp-name i02_lora_prompt_robust --max-epochs 10 --val-freq 5 --lr-scale 1.0 --lora-rank 16 --lora-alpha 32 --lora-targets transformer,decoder --lora-extra-trainable mask_decoder --level disease --phrase-index 1"
    note: 固定/多提示/多提示+负提示三组对照，均由 run_sam3_ft.py 的 --level/--phrase-index 切换（host=宿主级短语，disease=疾病级短语）；推理固定单提示。

  - id: I-03
    name: 轻量预标注 + 按需 SAM3 精修
    phase: innovation
    priority: engineering
    status: todo
    command: "{py} src/i03_ondemand_refine.py --yolo-weights {weights} --ckpt {sam3_weights} --data-root {data_root} --split val --limit 200 --out {out}"
    note: 无精修/全量/按需三组；记录精修调用率、P50/P95、人工秒数（编辑单位沿用 src/m6_editcost.py 的 realistic 权重 × --sec-per-unit）。按需判定四条规则：低置信/掩码不完整/掩码碎裂/目标过小。

  - id: I-04
    name: 病斑定位与宿主—病害识别解耦
    phase: innovation
    priority: extended
    status: todo
    command: "{py} src/i04_decoupled_eval.py --mode decoupled --ckpt {sam3_weights} --data-root {data_root} --meta-root {repo}/datasets/plantseg115 --split val --limit 150 --out {out}/decoupled"
    note: 三口径 host34 / direct115 / decoupled，均由 --mode 切换（队列里三条分别跑）。缺类不评估（val 缺 Peach peach rust，test 缺 Coffee coffee black rot），报告里列 classes_missing。
