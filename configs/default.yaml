# 全项目唯一配置源。换机器只改这里。
data:
  root: "H:/Plant/Plant_leaf_diseases_dataset_without_augmentation/Plant_leave_diseases_dataset_without_augmentation"
  # 增强版目录不要用：同一张图的翻转副本，会造成训练/测试泄漏
  forbidden_roots:
    - "Plant_leaf_diseases_dataset_with_augmentation"

classes:
  background_dir: "Background_without_leaves"   # 不是叶片，单独标记
  # 类名分隔符；注意 Tomato___Spider_mites Two-spotted... 里含空格
  separator: "___"

split:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42
  min_for_split: 10        # 少于这个数的小类，全部进训练集

paths:
  out: "out"
  manifest: "out/manifest.csv"
  classes_json: "out/classes.json"
  pseudo: "out/pseudo"
  figures: "out/figures"

# M2 离线伪标注：粗框（GrabCut，失败退回 LAB 距离）→ SAM2 精修 → 多边形
pseudo:
  sam_weights: "sam2.1_t.pt"
  device: 0                  # 0 = 第 0 张 GPU；没有卡就写 "cpu"
  box:
    ring: 8                  # 四周多少像素算「确定背景」
    grabcut_scale: 0.5       # GrabCut 降采样比例，纯提速
    grabcut_iters: 4
    center_lo: 0.25          # 中心框（可能前景）起止位置
    center_hi: 0.75
    pad: 0.06                # 送给 SAM 前把框外扩 6%
  accept:                    # 质量门槛，不达标的样本不进训练集
    min_area_ratio: 0.02
    max_area_ratio: 0.95
    min_box_fill: 0.15       # 掩码占提示框的比例下限，抓「只切到一小条」
    min_points: 6            # 多边形至少 6 个点，否则当成没分出来
  polygon:
    max_points: 80           # approxPolyDP 之后最多保留多少点
    eps_ratio: 0.004         # 简化精度，占周长的比例
